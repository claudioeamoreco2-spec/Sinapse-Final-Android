<title id="title">Capítulo 6 — O Coração da Tempestade: cena 1</title><desc id="desc">Ilustração vetorial original da cena do capítulo 6, página 11. Eron ensina Caleb a acertar a garrafa sem destruir a pedra. Trecho de referência: Uma pequena descarga púrpura atingiu a garrafa. Cores e composição são interpretação artística do texto recuperado.</desc>
