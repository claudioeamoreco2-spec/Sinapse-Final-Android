<title id="title">Capítulo 1 — O Brilho da Tempestade: cena 2</title><desc id="desc">Ilustração vetorial original da cena do capítulo 1, página 3. Na sala de aula abandonada, Oliver coleta o sangue de Caleb. Trecho de referência: Oliver se aproximou com uma seringa. Cores e composição são interpretação artística do texto recuperado.</desc>
