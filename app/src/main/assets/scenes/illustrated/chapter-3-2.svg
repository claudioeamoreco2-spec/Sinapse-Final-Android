<title id="title">Capítulo 3 — A Descoberta do Ponto Fraco: cena 2</title><desc id="desc">Ilustração vetorial original da cena do capítulo 3, página 11. Na floresta, os golpes de Caleb não conseguem mover Eron. Trecho de referência: O velho continua exatamente onde estava. Cores e composição são interpretação artística do texto recuperado.</desc>
