<title id="title">Capítulo 10 — A Segunda Chance: cena 3</title><desc id="desc">Ilustração vetorial original da cena do capítulo 10, página 7. Depois do retorno, Oliver e os cinco aliados enfrentam juntos a chegada de Harkan. Trecho de referência: Os cinco se posicionaram ao lado dele. Cores e composição são interpretação artística do texto recuperado.</desc>
