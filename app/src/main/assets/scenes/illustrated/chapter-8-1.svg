<title id="title">Capítulo 8 — Ecos na Escuridão: cena 1</title><desc id="desc">Ilustração vetorial original da cena do capítulo 8, página 2. Oliver corre pela névoa, enquanto as cinco marcas reaparecem em suas visões. Trecho de referência: cinco marcas brilhando diante de seus olhos. Cores e composição são interpretação artística do texto recuperado.</desc>
