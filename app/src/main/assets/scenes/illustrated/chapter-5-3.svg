<title id="title">Capítulo 5 — Vozes na Névoa: cena 3</title><desc id="desc">Ilustração vetorial original da cena do capítulo 5, página 4. Entre os ecos de quarenta e cinco vidas, a garota toca Caleb com um brilho intenso. Trecho de referência: Ela o toca. Um brilho violento o envolve. Cores e composição são interpretação artística do texto recuperado.</desc>
