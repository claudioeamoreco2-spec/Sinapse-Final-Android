<title id="title">Capítulo 8 — Ecos na Escuridão: cena 3</title><desc id="desc">Ilustração vetorial original da cena do capítulo 8, página 5. Acima das nuvens, Sael e Ágata observam a metade do Coração de Kaelum. Trecho de referência: A metade do Coração de Kaelum flutuava entre os dois. Cores e composição são interpretação artística do texto recuperado.</desc>
