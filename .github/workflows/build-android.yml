name: Validar e compilar Sinapse Final

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validar importação e módulos offline
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check_android_core.py
          for script in app/src/main/assets/*.js; do node --check "$script"; done
          node --test tests/*.cjs
          if [ -f package.json ]; then npm test; fi
      - name: Gerar trilha original
        run: python3 scripts/generate_soundtrack.py
      - name: Verificar preservação das fontes e imagens
        run: python3 scripts/verify_project.py
      - name: Validar interface no Chromium
        run: |
          python3 -m pip install playwright
          python3 scripts/test_browser.py --browser /usr/bin/google-chrome
      - name: Testar, analisar e compilar APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verificar assinatura do APK
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk"
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sinapse_Final_Ecos_de_Nerakar_Debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sinapse-Final-Ecos-de-Nerakar-Debug
          path: Sinapse_Final_Ecos_de_Nerakar_Debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sinapse-Final-validation-reports
          path: app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sinapse-Final-browser-validation
          path: qa-output/
          if-no-files-found: ignore

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar áudio e SDK
        run: |
          python3 scripts/generate_soundtrack.py
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sinapse-Final-Android-${{ matrix.api }}-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
