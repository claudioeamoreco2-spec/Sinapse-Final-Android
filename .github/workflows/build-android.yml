name: Compilar APK Android 15

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar trilha original
        run: python3 scripts/generate_soundtrack.py
      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sinapse_Final_Android15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sinapse-Final-Android15
          path: Sinapse_Final_Android15.apk
          if-no-files-found: error
